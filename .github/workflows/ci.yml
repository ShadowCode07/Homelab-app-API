name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Back/HomelabAPI/HomelabAPI.sln

      - name: Build
        run: dotnet build Back/HomelabAPI/HomelabAPI.sln --no-restore

      - name: Test
        run: dotnet test Back/HomelabAPI/HomelabAPI.sln --no-build
