name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HomelabAPI.sln

      - name: Build
        run: dotnet build HomelabAPI.sln --no-restore --configuration Release


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HomelabAPI.sln

      - name: Test
        run: dotnet test HomelabAPI.sln --no-restore --configuration Release


  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full git history, so Sonar can tell new code from old code

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java (the scanner needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ddotnet sonarscanner begin \
            /k:"ShadowCode07_Homelab-app-API" \
            /o:"shadowcode07" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/*/coverage.opencover.xml"

          dotnet build HomelabAPI.sln --configuration Release --no-incremental

          dotnet test HomelabAPI.sln --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"


  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HomelabAPI.sln

      - name: Publish
        run: dotnet publish HomelabAPI.Presentation/HomelabAPI.Presentation.csproj --no-restore --configuration Release --output ./publish
